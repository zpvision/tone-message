server {
    listen 80;
    listen [::]:80;
    server_name ai.example.com;
    access_log off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/finkoper-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://ai.example.com$request_uri; }
}
