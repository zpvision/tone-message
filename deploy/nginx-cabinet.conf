server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name ai.example.com 203.0.113.10 _;
    access_log off;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/finkoper-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location = /api/v1/chat/completions {
        default_type application/json;
        add_header X-Request-ID $request_id always;
        return 426 '{"error":{"code":"https_required","message":"Use HTTPS; never send API keys over HTTP","request_id":"$request_id"}}';
    }
    location = /v1/chat/completions {
        default_type application/json;
        add_header X-Request-ID $request_id always;
        return 426 '{"error":{"code":"https_required","message":"Use HTTPS; never send API keys over HTTP","request_id":"$request_id"}}';
    }
    location / { return 308 https://ai.example.com$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ai.example.com;
    ssl_certificate /etc/letsencrypt/live/ai.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:FinKoperTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    auth_basic "FinKoper AI testing";
    auth_basic_user_file /etc/nginx/finkoper-ai.htpasswd;
    client_max_body_size 31m;
    client_body_timeout 120s;
    send_timeout 620s;
    server_tokens off;
    access_log off;
    add_header Strict-Transport-Security "max-age=86400" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    location = /api/v1/chat/completions { include /etc/nginx/snippets/finkoper-ai-api.conf; }
    location = /v1/chat/completions { include /etc/nginx/snippets/finkoper-ai-api.conf; }
    location @api_body_too_large {
        auth_basic off;
        default_type application/json;
        add_header X-Request-ID $request_id always;
        return 413 '{"error":{"code":"body_too_large","message":"HTTP body exceeds 5 MiB","request_id":"$request_id"}}';
    }
    location / { include /etc/nginx/snippets/finkoper-ai-cabinet.conf; }
}
# Existing tunnel cabinet access; API requires HTTPS.
server {
    listen 127.0.0.1:8080;
    server_name _;
    auth_basic "FinKoper AI testing";
    auth_basic_user_file /etc/nginx/finkoper-ai.htpasswd;
    client_max_body_size 31m;
    access_log off;
    server_tokens off;
    location = /api/v1/chat/completions { return 426; }
    location = /v1/chat/completions { return 426; }
    location / { include /etc/nginx/snippets/finkoper-ai-cabinet.conf; }
}
